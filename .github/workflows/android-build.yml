name: Android Build (debug APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        # 러너에 SDK가 내장되어 있으나 sdkmanager가 PATH에 없는 경우가 있어 ANDROID_HOME 기준으로 호출.
        # (setup-android@v3는 구버전 'tools' 패키지 설치 시도로 실패 — 2026-09-17 Google 제거)
        run: |
          SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          SDKM=$SDK/cmdline-tools/latest/bin/sdkmanager
          [ -x "$SDKM" ] || SDKM=$SDK/tools/bin/sdkmanager
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle wrapper validation
        # gradle-wrapper.jar가 저장소에 없으면 wrapper 실행 자체가 실패 —
        # Gradle 공식 배포판으로 jar를 재생성해 복구합니다.
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.9/bin/gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: snap2read-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
